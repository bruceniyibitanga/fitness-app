# Root of the Dart pub workspace for the mobile apps.
#
# Every package listed under `workspace:` shares one dependency resolution and one
# pubspec.lock, so the phone app, the watch app and the shared packages can never
# drift onto different versions of the same dependency.
# Docs: https://dart.dev/tools/pub/workspaces
name: calisthenics_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/training_core

dev_dependencies:
  lints: ">=5.0.0 <8.0.0"
