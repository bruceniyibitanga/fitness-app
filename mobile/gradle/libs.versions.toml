# Every dependency and plugin version for the mobile apps lives here.
# Only list what a module actually uses; add entries when the code needs them.
#
# Dependabot reads this file and opens weekly update PRs. Pin exact versions
# (no "+" or ranges) so a build today and a build next month resolve the same
# code. Before bumping a major version, read its release notes and check the
# compatibility notes at the top of each section.

[versions]
# Android SDK levels, shared by both apps so they never drift apart.
# compileSdk and targetSdk track the newest stable Android release. AGP 9.5
# supports API 37.
android-compileSdk = "37"
android-targetSdk = "37"
# Phone: Android 9. Covers the vast majority of active devices and every
# device Health Connect supports.
android-minSdk-phone = "28"
# Watch: Wear OS 3 (API 30) is the first version with Health Services and the
# unified Wear OS platform. Older watches can't run the exercise APIs we need.
android-minSdk-wear = "30"

# Build tooling. AGP 9 compiles Kotlin itself ("built-in Kotlin"), so the app
# modules don't apply the Kotlin Android plugin. Declaring the Kotlin plugins
# below at a newer version upgrades the compiler AGP uses.
agp = "9.5.1"
kotlin = "2.4.21"
# KSP2 versions are independent of the Kotlin version since KSP 2.3.0.
ksp = "2.3.13"

# Kotlin libraries
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"

# Google Play services: the Wearable Data Layer, which links the phone and the watch.
play-services-wearable = "20.0.1"

# Dependency injection. Hilt 2.59 and later support AGP 9.
hilt = "2.60.1"
androidx-hilt = "1.3.0"

# AndroidX
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.2.1"
room = "2.8.5"
compose-bom = "2026.09.00"
wear-compose = "1.7.1"
# Health Services: heart rate and the workout session on the watch.
health-services = "1.1.0"
# Shows a running workout on the watch face and in the launcher.
wear-ongoing = "1.1.0"

# Code quality
# detekt 1.23.8 is built against Kotlin 2.0.21. Its Gradle task runs the
# analyser on its own classpath, pinned to that Kotlin version in the root
# build file, so it is independent of the compiler version above.
detekt = "1.23.8"
detekt-kotlin = "2.0.21"
spotless = "8.11.0"
ktlint = "1.8.0"

# Encrypted SQLite for Room. Zetetic's maintained library; the older
# android-database-sqlcipher is deprecated.
sqlcipher = "4.20.0"

# Testing
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Lets coroutines wait for Play services Tasks with await(), as the Data Layer docs do.
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "play-services-wearable" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }

# Compose. The BOM picks matching versions of every Compose library, and
# both apps import it so their Compose versions never differ.
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }

# Watch UI. Wear Compose is released separately from the BOM.
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-ui-tooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wear-compose" }
wear-compose-navigation3 = { module = "androidx.wear.compose:compose-navigation3", version.ref = "wear-compose" }

health-services-client = { module = "androidx.health:health-services-client", version.ref = "health-services" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wear-ongoing" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

# Gradle plugins used by the convention plugins in build-logic/. They are
# compile-only there; the versions that run come from the [plugins] below.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }

# Convention plugins from build-logic/. They hold the settings every Android
# module shares, so each module's build file only says what is different.
levitx-android-application = { id = "levitx.android.application" }
levitx-android-library = { id = "levitx.android.library" }
levitx-hilt = { id = "levitx.hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
