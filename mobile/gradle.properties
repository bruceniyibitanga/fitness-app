# Gradle settings shared by everyone who builds the apps, including CI.

# Give the Gradle daemon enough memory for Android and Compose builds.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Build independent modules at the same time and reuse earlier task outputs.
org.gradle.parallel=true
org.gradle.caching=true

# Use the Kotlin coding conventions for IDE formatting.
kotlin.code.style=official
