# Changes to detekt's default rules. Everything not listed here uses the
# default from detekt 1.23.8.

comments:
  # Every public class, function and property must say what it is for.
  UndocumentedPublicClass:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**']

complexity:
  LongParameterList:
    # Compose screens take their state plus one lambda per user action, which
    # is how Compose wants state hoisted. Grouping lambdas into objects only to
    # please this rule would make screens harder to read.
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    # Composable functions are named like types.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    # A number assigned to a named property is a named constant, which is
    # what this rule asks for. Compose tokens like `val ScreenPadding = 24.dp`
    # are written that way.
    ignorePropertyDeclaration: true
    # Tests are full of literal expected values; that is the point of them.
    excludes: ['**/test/**', '**/commonTest/**', '**/androidTest/**']
    ignoreAnnotated: ['Preview', 'WearPreviewDevices']
  UnusedPrivateMember:
    # Previews are private and only called by Android Studio.
    ignoreAnnotated: ['Preview', 'WearPreviewDevices']

exceptions:
  SwallowedException:
    # DataUnavailableException is an expected failure: ViewModels catch it and
    # show an explanation instead, which is the point, not swallowing it.
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
      - 'DataUnavailableException'
      # Data saved by a newer version of the app: screens explain it instead.
      - 'UnreadableCoachStateException'
      # The watch link being unavailable is normal (no watch, out of range).
      # Sync skips the pass and tries again later.
      - 'DataLayerUnavailableException'
