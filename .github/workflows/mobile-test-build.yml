# Builds the phone and watch apps for testing on real devices, without
# Android Studio. Each run leaves two APKs to download from its summary page:
# levitx-phone-test-<run>.apk and levitx-watch-test-<run>.apk. How to install
# them is in docs/app/TESTING-ON-DEVICES.md.
#
# Runs on every push to main that touches the apps, and on demand from the
# Actions tab ("Run workflow").
#
# Both APKs are signed with the shared test key from the repository secrets,
# so they can talk to each other and each new build installs over the last.
# Without the secrets they are signed with a throwaway key and the run says so.
name: Mobile test build

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-test-build.yml"
  workflow_dispatch:

# Read-only token: this workflow never writes to the repo.
permissions:
  contents: read

# Only the newest build matters; an older one still running is cancelled.
concurrency:
  group: mobile-test-build
  cancel-in-progress: true

jobs:
  build:
    name: Build test APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The MIT-licensed cache, as in mobile-ci.yml.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The key lives in the runner's temp folder, which is wiped when the job
      # ends. Without the secrets a throwaway key is made in the same format,
      # so the signing setup is exercised on every run either way.
      - name: Set up the test signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LEVITX_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LEVITX_TEST_KEYSTORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/levitx-test.p12"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::No test signing key in the repository secrets. These builds use a throwaway key, so they can't be installed over earlier test builds. See docs/app/TESTING-ON-DEVICES.md."
            password=$(openssl rand -hex 24)
            echo "::add-mask::$password"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass "$password" -keypass "$password" \
              -alias levitx-test -keyalg RSA -keysize 3072 -validity 1 -dname "CN=Levitx throwaway test key" 2>/dev/null
          fi
          {
            echo "LEVITX_TEST_KEYSTORE=$keystore"
            echo "LEVITX_TEST_KEYSTORE_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      # LEVITX_TEST_KEYSTORE and LEVITX_TEST_KEYSTORE_PASSWORD, set above, are
      # read by the levitx.android.application convention plugin.
      - name: Build
        env:
          LEVITX_TEST_BUILD_LABEL: test.${{ github.run_number }}
        run: ./gradlew :app-phone:assembleDebug :app-wear:assembleDebug --stacktrace

      - name: Name the APKs
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          cp app-phone/build/outputs/apk/debug/app-phone-debug.apk "$RUNNER_TEMP/apks/levitx-phone-test-$RUN_NUMBER.apk"
          cp app-wear/build/outputs/apk/debug/app-wear-debug.apk "$RUNNER_TEMP/apks/levitx-watch-test-$RUN_NUMBER.apk"

      # The Data Layer only links apps signed with the same key, so this is
      # checked here rather than discovered on a watch. The fingerprint goes in
      # the summary so it can be compared with the one in the docs.
      - name: Check both apps share a signing key
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          # The first signer's certificate digest. apksigner's wording varies
          # between versions, so match on the part every version prints.
          fingerprint() {
            "$apksigner" verify --print-certs "$1" | grep -m 1 'certificate SHA-256 digest:' | awk '{print $NF}'
          }
          phone=$(fingerprint "$RUNNER_TEMP"/apks/levitx-phone-test-*.apk)
          watch=$(fingerprint "$RUNNER_TEMP"/apks/levitx-watch-test-*.apk)
          echo "Phone: ${phone:-none}"
          echo "Watch: ${watch:-none}"
          if [ -z "$phone" ] || [ "$phone" != "$watch" ]; then
            echo "::error::The phone and watch APKs are not signed with the same key."
            # Certificates are public, so the full output is safe to show.
            "$apksigner" verify --print-certs "$RUNNER_TEMP"/apks/levitx-phone-test-*.apk || true
            exit 1
          fi
          {
            echo "### Test build ${{ github.run_number }}"
            echo
            echo "Download **levitx-phone-test** and **levitx-watch-test** from the Artifacts section below."
            echo "How to install them: docs/app/TESTING-ON-DEVICES.md"
            echo
            echo "Signing key SHA-256: \`$phone\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded unzipped (archive: false), so the phone can install the APK
      # straight from the browser download.
      - name: Upload the phone APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/apks/levitx-phone-test-${{ github.run_number }}.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      - name: Upload the watch APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/apks/levitx-watch-test-${{ github.run_number }}.apk
          archive: false
          retention-days: 30
          if-no-files-found: error
