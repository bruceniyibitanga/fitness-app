# Builds the phone and watch release bundles (.aab), signed with the upload
# key, ready to upload to Google Play. How to use it, and everything else a
# release needs, is in docs/app/RELEASE.md.
#
# Runs only by hand, from main, in the "release" environment. The upload key
# is a secret of that environment, so no other workflow, branch or pull
# request can read it, and the environment can require an approval first.
name: Mobile release

on:
  workflow_dispatch:

# Read-only token: this workflow never writes to the repo.
permissions:
  contents: read

# Never cancel a release build part way. A second one waits its turn.
concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  bundle:
    name: Build signed release bundles
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Only from main
        if: ${{ github.ref != 'refs/heads/main' }}
        working-directory: .
        run: |
          echo "::error::Release bundles are only built from main. This run is on $GITHUB_REF."
          exit 1

      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # No Gradle cache: a release is built from the sources alone, so nothing
      # another workflow left in the cache can end up in it.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The key lives in the runner's temp folder, readable only by this job's
      # user, and is deleted at the end even if the build fails. There is no
      # throwaway fallback: a release without the real upload key is useless.
      - name: Set up the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.LEVITX_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LEVITX_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The upload key isn't in the release environment's secrets. See docs/app/RELEASE.md, step 2."
            exit 1
          fi
          keystore="$RUNNER_TEMP/levitx-upload.p12"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "LEVITX_UPLOAD_KEYSTORE=$keystore"
            echo "LEVITX_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      # LEVITX_UPLOAD_KEYSTORE and its password, set above, are read by the
      # levitx.android.application convention plugin.
      - name: Build the bundles
        run: ./gradlew :app-phone:bundleRelease :app-wear:bundleRelease --no-build-cache --stacktrace

      - name: Name the bundles
        run: |
          version=$(sed -n 's/^levitx\.versionName=//p' gradle.properties)
          release=$(sed -n 's/^levitx\.release=//p' gradle.properties)
          name="$version-r$release"
          mkdir -p "$RUNNER_TEMP/release"
          cp app-phone/build/outputs/bundle/release/app-phone-release.aab "$RUNNER_TEMP/release/levitx-phone-$name.aab"
          cp app-wear/build/outputs/bundle/release/app-wear-release.aab "$RUNNER_TEMP/release/levitx-watch-$name.aab"
          # R8's maps, for Play Console to turn renamed code in crash reports back into ours.
          cp app-phone/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/release/mapping-phone-$name.txt"
          cp app-wear/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/release/mapping-watch-$name.txt"
          echo "RELEASE_NAME=$name" >> "$GITHUB_ENV"

      # The Data Layer only links apps signed with the same key, and Play only
      # accepts bundles signed with the registered upload key. Both are checked
      # here, and the fingerprint goes in the summary to compare with Play Console.
      - name: Check both bundles carry the upload key
        run: |
          fingerprint() {
            keytool -printcert -jarfile "$1" | grep -m 1 'SHA256:' | awk '{print $2}'
          }
          phone=$(fingerprint "$RUNNER_TEMP/release/levitx-phone-$RELEASE_NAME.aab")
          watch=$(fingerprint "$RUNNER_TEMP/release/levitx-watch-$RELEASE_NAME.aab")
          echo "Phone: ${phone:-none}"
          echo "Watch: ${watch:-none}"
          if [ -z "$phone" ] || [ "$phone" != "$watch" ]; then
            echo "::error::The phone and watch bundles are not both signed with the upload key."
            exit 1
          fi
          {
            echo "### Release $RELEASE_NAME"
            echo
            echo "Download **levitx-release-$RELEASE_NAME** from the Artifacts section below, then follow docs/app/RELEASE.md."
            echo
            echo "Upload key SHA-256: \`$phone\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the upload key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/levitx-upload.p12"

      - name: Upload the bundles and maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: levitx-release-${{ env.RELEASE_NAME }}
          path: ${{ runner.temp }}/release/
          retention-days: 90
          if-no-files-found: error
