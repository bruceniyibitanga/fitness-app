# Weekly dependency update pull requests, so security fixes don't sit unnoticed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
