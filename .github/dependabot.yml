# Weekly dependency update pull requests, so security fixes don't sit unnoticed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom must always be the same version. Bumped apart,
      # the site fails to build (it happened with 19.3.1), so they move together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Tailwind's packages are released together.
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
    ignore:
      # TypeScript 7 (the native compiler) breaks linting: typescript-eslint,
      # which eslint-config-next uses, only supports TypeScript below 6.1.
      # Remove this once typescript-eslint supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Reads mobile/gradle/libs.versions.toml and the Gradle wrapper version.
  - package-ecosystem: gradle
    directory: "/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Compose, Wear Compose and AGP are released together often enough that
      # one PR per family is easier to review and test than one per artifact.
      androidx:
        patterns: ["androidx.*", "com.android.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
